name: CI - Milestone D4

on:
  push:
    branches: [ main, FastAPI-Frontend, bonus ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/al-jurjani/detoxifyai
  CANARY_PORT: 8000
  ACCEPTANCE_FILE: tests/golden.json
  AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
      - name: Run ruff
        run: ruff check .
      - name: Run black (check)
        run: black --check .

  security:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Run pip-audit on project dependencies
        run: |
          echo "🔍 Scanning dependencies for known vulnerabilities..."
          pip-audit -r requirements.txt -r requirements-dev.txt --strict

  test:
    name: Tests (pytest + coverage >= 65%)
    runs-on: ubuntu-latest
    needs: lint
    needs: security
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest pytest-cov; fi
      - name: Run tests with coverage
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=app --cov-report=xml --cov-fail-under=65

  build_and_push:
    name: Build & Push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (optional, for multi-arch)
        uses: docker/setup-qemu-action@v2
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:canary
          file: ./Dockerfile
          build-args: |
            PYTHONUNBUFFERED=1

  canary_and_acceptance:
    name: Canary deploy + Acceptance tests
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - uses: actions/checkout@v4
      - name: Install jq and curl
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Pull image
        run: docker pull $IMAGE_NAME:${{ github.sha }}
      - name: Run canary container
        run: |
          docker rm -f canary || true
          docker run -d --name canary \
            -e CANARY=true \
            -e AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            -p 8000:8000 \
            $IMAGE_NAME:${{ github.sha }}
      - name: Wait for /health (timeout 60s)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo "000")
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "waiting for health ($i) got $code"
            sleep 2
          done
          docker logs canary || true
          echo "container failed to become healthy"; exit 1
      - name: Run acceptance tests (golden queries)
        run: |
          if [ ! -f "$ACCEPTANCE_FILE" ]; then
            echo "Warning: acceptance file $ACCEPTANCE_FILE not found. Creating a small default set."
            cat > "$ACCEPTANCE_FILE" <<'JSON'
          ["hello", "is this service alive?", "what is the sentiment of this text?", "sample input 4", "sample input 5"]
          JSON
          fi

          failures=0
          total=0

          while IFS= read -r q; do
            total=$((total+1))
            # Example: POST to /predict with JSON { "text": "<query>" }
            status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:${CANARY_PORT}/predict" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"$q\"}")

            echo "query: $q -> $status"

            if [ "$status" != "200" ]; then
              failures=$((failures+1))
            fi
          done < <(jq -r '.[]' "$ACCEPTANCE_FILE")

          echo "Acceptance results: $failures failures out of $total"

          if [ "$failures" -gt 0 ]; then
            docker logs canary || true
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker rm -f canary || true
