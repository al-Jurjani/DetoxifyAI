# Ruff configuration
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "mlflow-env",
    ".pytest_cache",
    "*.egg-info",
    "dist",
    "build",
    "Notebooks",
    "notebooks",
    "Evidently",
    "evidently_workspace",
]

line-length = 120

[lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Ignore line too long
